# Runs the backend and the frontend as two containers on a shared network with one command:
#     docker compose up -d --build
# Both containers share one Docker network. The frontend calls the API through the port the backend publishes on the host
# (host.docker.internal:7860): in GitHub Codespaces direct container-to-container traffic times out, while this route works
# there, on Linux and on Docker Desktop.
name: superkart

services:
  backend:
    build: ./backend_files
    container_name: superkart-backend
    ports:
      - "7860:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  frontend:
    build: ./frontend_files
    container_name: superkart-frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://host.docker.internal:7860
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
